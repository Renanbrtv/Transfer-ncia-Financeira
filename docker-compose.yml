# Sobe SQL Server + API + frontend:  docker compose up --build
#   Frontend: http://localhost:3000
#   Swagger:  http://localhost:5080/swagger
#
# A senha do SQL Server vem da variável MSSQL_SA_PASSWORD (arquivo .env, ver .env.example).
# O valor padrão abaixo existe só para facilitar a avaliação local; não use em outro ambiente.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Transfers@Local2026}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/Transfers.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TransfersDb: "Server=sqlserver,1433;Database=TransfersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Transfers@Local2026};TrustServerCertificate=True;Encrypt=True"
      Database__ApplyMigrationsOnStartup: "true"
      Swagger__Enabled: "true"
    ports:
      - "5080:8080"
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    # "Saudável" só depois de aplicar as migrations e começar a responder.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlserver-data:
