server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o upstream em uma variável, o Nginx resolve o nome "api" a cada
    # 10 s em vez de uma única vez na subida. Sem isso, se a API subir depois do Nginx ou for
    # reiniciada (novo IP), todas as chamadas passam a responder 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Usado pelo indicador de status da API na interface.
    location = /health {
        proxy_pass $api_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
